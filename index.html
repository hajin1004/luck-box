<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCKY 6:4</title>
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { text-align: center; padding: 20px; width: 100%; max-width: 400px; }
        .lucky-btn { 
            background: linear-gradient(45deg, #f4c20d, #bf953f); 
            color: #000; border: none; padding: 25px 0; width: 100%; 
            font-size: 26px; font-weight: bold; border-radius: 15px; 
            cursor: pointer; box-shadow: 0 0 20px rgba(244, 194, 13, 0.5);
            transition: 0.3s; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .info { margin-top: 30px; color: #666; font-size: 13px; }
        /* 영상 재생 화면 스타일 */
        .video-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; }
        video { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div id="main-content" class="container">
        <h1 style="margin-bottom: 40px; color: #f4c20d;">🎰 6:4 LUCKY BOX</h1>
        <button class="lucky-btn" onclick="startLucky()"> 🎁 </button>
        <div class="info">
            버튼을 누르면 랜덤으로 페이지가 이동합니다.<br>
            (60% 확률 영상 / 40% 확률 아이템)<br><br>
            <small style="opacity: 0.5;">이 포스팅은 쿠팡 파트너스 활동의 일환으로 수수료를 제공받을 수 있습니다.</small>
        </div>
    </div>

    <script>
        const videoLinks = [
            "https://image2url.com/r2/default/videos/1773757057551-2b5fe024-98af-4ad6-ad62-a233ca83f3e2.mp4",
            "https://image2url.com/r2/default/videos/1773757406771-8c34d23e-5d10-4f08-aeae-0f58f5bf1c93.mp4",
            "https://image2url.com/r2/default/videos/1773757454966-dabbda65-27f1-4846-bf98-1984d3cf37ad.mp4"
        ];
        const adLinks = [
            "https://link.coupang.com/a/dLXD5X",
            "https://link.coupang.com/a/dN4QKg",
            "https://link.coupang.com/a/dN4R06"
        ];

        let retryCount = 0;
        const MAX_RETRIES = 5; // 최대 재시도 횟수

        function playVideo(url) {
            // 메인 콘텐츠 숨기고 비디오 플레이어 생성
            document.getElementById('main-content').style.display = 'none';
            
            let overlay = document.getElementById('video-player');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'video-player';
                overlay.className = 'video-overlay';
                document.body.appendChild(overlay);
            }

            overlay.innerHTML = `
                <video id="luckyVideo" controls autoplay playsinline>
                    <source src="${url}" type="video/mp4">
                </video>
            `;

            const video = document.getElementById('luckyVideo');

            // 영상 로드 에러 시 실행되는 핵심 로직
            video.onerror = function() {
                console.error("영상 로드 실패: " + url);
                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    const nextUrl = videoLinks[Math.floor(Math.random() * videoLinks.length)];
                    playVideo(nextUrl); // 다른 영상으로 재시도
                } else {
                    alert("영상 로드에 실패했습니다. 메인으로 돌아갑니다.");
                    location.reload();
                }
            };
        }

        function startLucky() {
            const rand = Math.random();
            if (rand < 0.6) {
                retryCount = 0;
                const initialUrl = videoLinks[Math.floor(Math.random() * videoLinks.length)];
                playVideo(initialUrl);
            } else {
                const adUrl = adLinks[Math.floor(Math.random() * adLinks.length)];
                window.location.href = adUrl;
            }
        }
    </script>
</body>
</html>
